<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma-OGL · Preparar en Gmail</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --azul:#0a6ed1; --borde:#c9d3df; --texto:#1d2d3e; --fondo:#f5f6f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:15px system-ui,-apple-system,Segoe UI,sans-serif; }
  .tarjeta { max-width:760px; margin:32px auto; background:#fff; border:1px solid var(--borde); border-radius:10px; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#5b6b7c; margin:0 0 20px; font-size:13px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:13px; }
  input[type=text], input[type=email], textarea { width:100%; padding:9px 11px; border:1px solid var(--borde); border-radius:6px; font:inherit; }
  textarea { min-height:170px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--azul); outline-offset:-1px; }
  #lista-adjuntos { margin:8px 0 0; padding:0; list-style:none; font-size:13px; color:#44566a; }
  #lista-adjuntos li { padding:3px 0; }
  button { background:var(--azul); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; margin-top:20px; }
  button:disabled { opacity:.6; cursor:wait; }
  #estado { margin-top:12px; font-size:13px; min-height:18px; }
  #estado.error { color:#b00020; }
  #estado.ok { color:#107e3e; }
</style>
</head>
<body>

<div class="tarjeta">
  <h1>Preparar correo en Gmail</h1>
  <p class="sub">Se crea el correo con asunto, cuerpo y adjuntos en tu Gmail corporativo. Los destinatarios los eliges tú en Gmail.</p>

  <label for="correo">Tu cuenta corporativa</label>
  <input type="email" id="correo" placeholder="usuario@upao.edu.pe" autocomplete="email">

  <label for="asunto">Asunto</label>
  <input type="text" id="asunto" value="Solicitud de autorización de horas de sobretiempo: Nombre Apellidos">

  <label for="cuerpo">Cuerpo del mensaje (no repitas el asunto)</label>
  <textarea id="cuerpo">Estimados:

Por medio del presente solicito la autorización de las horas de sobretiempo indicadas en el formato adjunto.

Quedo atento(a) a su respuesta.

Saludos cordiales.</textarea>

  <label for="adjuntos">Adjuntos (Excel u otros)</label>
  <input type="file" id="adjuntos" multiple>
  <ul id="lista-adjuntos"></ul>

  <button id="btnPrepararGmail" type="button">Preparar en Gmail</button>
  <div id="estado" role="status"></div>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN: pega aquí tu Client ID de Google Cloud
   (Gmail API habilitada + scope gmail.compose en la pantalla de consentimiento)
   ===================================================================== */
const OGL_GMAIL = {
  CLIENT_ID: '180186417978-67sglmuv6r142o0s3s6iqpdd68j1hils.apps.googleusercontent.com',
  SCOPE: 'https://www.googleapis.com/auth/gmail.compose',
  WINDOW_NAME: 'gmail_ogl',          // nombre fijo = siempre la misma pestaña
  DOMINIO: 'upao.edu.pe'
};

/* ---------- Token: se guarda en memoria, solo pide permiso la 1.ª vez ---------- */
let _token = null; // { value, expiraEn }
const _tokenVigente = () => _token && Date.now() < _token.expiraEn - 60000;

function _obtenerToken(correo) {
  return new Promise((resolve, reject) => {
    if (_tokenVigente()) return resolve(_token.value);
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return reject(new Error('No cargó el script de Google. Revisa tu conexión y recarga la página.'));
    }
    const cliente = google.accounts.oauth2.initTokenClient({
      client_id: OGL_GMAIL.CLIENT_ID,
      scope: OGL_GMAIL.SCOPE,
      hint: correo,
      callback: (resp) => {
        if (resp.error) return reject(new Error(resp.error));
        _token = { value: resp.access_token, expiraEn: Date.now() + (Number(resp.expires_in) || 3600) * 1000 };
        resolve(_token.value);
      },
      error_callback: (e) => reject(new Error(e && e.type ? e.type : 'Autorización cancelada'))
    });
    cliente.requestAccessToken({ prompt: '' });
  });
}

/* ---------- Utilidades MIME ---------- */
function _b64Texto(texto) {
  const bytes = new TextEncoder().encode(texto);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const _partir = (b64) => b64.replace(/(.{76})/g, '$1\r\n');
const _utf8 = (t) => '=?UTF-8?B?' + _b64Texto(t) + '?=';
const _escapar = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function _leerBase64(archivo) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('No se pudo leer el adjunto: ' + archivo.name));
    r.readAsDataURL(archivo);
  });
}

async function _construirMime({ correo, asunto, cuerpoHtml, adjuntos }) {
  const lim = 'OGL_' + Math.random().toString(36).slice(2) + Date.now();
  const L = [
    'From: ' + correo,
    'Subject: ' + _utf8(asunto),
    'MIME-Version: 1.0',
    'Content-Type: multipart/mixed; boundary="' + lim + '"',
    '',
    '--' + lim,
    'Content-Type: text/html; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    _partir(_b64Texto(cuerpoHtml))
  ];
  for (const f of adjuntos) {
    const nombre = f.name || 'adjunto';
    L.push('--' + lim,
      'Content-Type: ' + (f.type || 'application/octet-stream') + '; name="' + _utf8(nombre) + '"',
      'Content-Disposition: attachment; filename="' + _utf8(nombre) + '"',
      'Content-Transfer-Encoding: base64',
      '',
      _partir(await _leerBase64(f)));
  }
  L.push('--' + lim + '--');
  return L.join('\r\n');
}

/* ---------- Aviso de respaldo (si el navegador bloquea abrir la pestaña) ---------- */
function _mostrarAviso(url) {
  const previo = document.getElementById('oglAvisoGmail');
  if (previo) previo.remove();
  const caja = document.createElement('div');
  caja.id = 'oglAvisoGmail';
  caja.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;background:#fff;color:#1d2d3e;' +
    'border:1px solid #c9d3df;border-left:4px solid #0a6ed1;border-radius:8px;padding:14px 16px;' +
    'box-shadow:0 4px 16px rgba(0,0,0,.18);font:14px system-ui,sans-serif;max-width:340px';
  caja.innerHTML = '<div style="margin-bottom:10px"><b>El correo ya está listo.</b><br>¿Deseas ir a la plataforma de correos?</div>' +
    '<a id="oglIr" href="#" style="background:#0a6ed1;color:#fff;padding:7px 14px;border-radius:6px;text-decoration:none;display:inline-block;margin-right:8px">Ir al correo</a>' +
    '<a id="oglCerrar" href="#" style="color:#556;text-decoration:none">Cerrar</a>';
  document.body.appendChild(caja);
  document.getElementById('oglIr').onclick = (e) => { e.preventDefault(); window.open(url, OGL_GMAIL.WINDOW_NAME); caja.remove(); };
  document.getElementById('oglCerrar').onclick = (e) => { e.preventDefault(); caja.remove(); };
}

/* ---------- Función principal ---------- */
async function prepararEnGmail({ correo, asunto, cuerpoHtml, adjuntos }) {
  // Reservar la pestaña dentro del clic (si ya hay permiso) para que no la bloquee el navegador.
  let ventana = _tokenVigente() ? window.open('', OGL_GMAIL.WINDOW_NAME) : null;

  try {
    const token = await _obtenerToken(correo);
    const mime = await _construirMime({ correo, asunto, cuerpoHtml, adjuntos: adjuntos || [] });

    const resp = await fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/drafts?uploadType=media', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'message/rfc822' },
      body: mime
    });
    if (resp.status === 401) { _token = null; throw new Error('La sesión de Google venció. Vuelve a intentar.'); }
    if (!resp.ok) throw new Error('Gmail respondió ' + resp.status + ': ' + (await resp.text()));

    const borrador = await resp.json();
    const url = 'https://mail.google.com/mail/u/' + encodeURIComponent(correo) + '/#drafts?compose=' + borrador.message.id;

    if (ventana && !ventana.closed) { ventana.location.href = url; ventana.focus(); }
    else { _mostrarAviso(url); }
  } catch (err) {
    if (ventana && !ventana.closed && ventana.location.href === 'about:blank') ventana.close();
    throw err;
  }
}

/* ---------- Conexión con la página ---------- */
const $correo = document.getElementById('correo');
const $asunto = document.getElementById('asunto');
const $cuerpo = document.getElementById('cuerpo');
const $adjuntos = document.getElementById('adjuntos');
const $lista = document.getElementById('lista-adjuntos');
const $btn = document.getElementById('btnPrepararGmail');
const $estado = document.getElementById('estado');

// Recordar la cuenta corporativa en este navegador
try { $correo.value = localStorage.getItem('ogl_correo') || ''; } catch (e) {}

$adjuntos.addEventListener('change', () => {
  $lista.innerHTML = '';
  for (const f of $adjuntos.files) {
    const li = document.createElement('li');
    li.textContent = '📎 ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
    $lista.appendChild(li);
  }
});

function mostrar(msg, tipo) { $estado.textContent = msg; $estado.className = tipo || ''; }

$btn.addEventListener('click', async () => {
  const correo = $correo.value.trim().toLowerCase();
  const asunto = $asunto.value.trim();
  if (!correo.endsWith('@' + OGL_GMAIL.DOMINIO)) return mostrar('Escribe tu cuenta corporativa @' + OGL_GMAIL.DOMINIO + '.', 'error');
  if (!asunto) return mostrar('El asunto no puede estar vacío.', 'error');
  try { localStorage.setItem('ogl_correo', correo); } catch (e) {}

  // El cuerpo de texto se convierte a HTML conservando los saltos de línea
  const cuerpoHtml = '<div style="font-family:Arial,sans-serif;font-size:14px;white-space:pre-wrap">' +
                     _escapar($cuerpo.value) + '</div>';

  $btn.disabled = true;
  mostrar('Preparando el correo…');
  try {
    await prepararEnGmail({ correo, asunto, cuerpoHtml, adjuntos: Array.from($adjuntos.files) });
    mostrar('Listo: el correo está preparado en tu Gmail corporativo.', 'ok');
  } catch (err) {
    console.error('[Preparar en Gmail]', err);
    mostrar('No se pudo preparar el correo: ' + err.message, 'error');
  } finally {
    $btn.disabled = false;
  }
});
</script>
</body>
</html>
